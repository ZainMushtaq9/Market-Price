<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Market-Price</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; padding: 40px; border-radius: 15px; text-align: center; }
        h1 { color: #667eea; margin-bottom: 20px; }
        .contact-info { background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; text-align: left; }
        .contact-info h3 { color: #667eea; margin-bottom: 10px; }
        .back-link { color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 5px; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back</a>
        <div class="card">
            <h1>📧 Contact Us</h1>
            <p>We'd love to hear from you!</p>
            
            <div class="contact-info">
                <h3>📧 Email</h3>
                <p>General: info@market-price.com<br>
                Support: support@market-price.com<br>
                Business: business@market-price.com</p>
            </div>
            
            <div class="contact-info">
                <h3>💻 GitHub</h3>
                <p>Report issues or contribute:<br>
                <a href="https://github.com/ZainMushtaq9/Market-Price">github.com/ZainMushtaq9/Market-Price</a></p>
            </div>
            
            <div class="contact-info">
                <h3>🕒 Response Time</h3>
                <p>We typically respond within 24-48 hours</p>
            </div>
        </div>
    </div>
</body>
</html>
