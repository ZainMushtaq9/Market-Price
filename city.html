<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse by City - Pakistan Market Prices</title>
    <meta name="description" content="View market prices by city - Multan, Lahore, Karachi, Islamabad, Faisalabad, and more.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; }
        h1 { color: #667eea; margin-bottom: 20px; }
        .city-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .city-card { background: #f8f9fa; padding: 20px; border-radius: 10px; border-left: 4px solid #667eea; }
        .city-card h3 { color: #667eea; margin-bottom: 10px; }
        .back-link { color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 5px; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back</a>
        <div class="card">
            <h1>🏙️ Browse by City</h1>
            <p>Select a city to view current market prices</p>
            <div class="city-grid" id="cityGrid">
                <div class="city-card"><h3>Loading cities...</h3></div>
            </div>
        </div>
    </div>
    <script>
        async function loadCities() {
            const response = await fetch('/api/cities');
            const data = await response.json();
            const grid = document.getElementById('cityGrid');
            grid.innerHTML = data.cities.map(city => `
                <div class="city-card">
                    <h3>📍 ${city}</h3>
                    <p>View prices in ${city}</p>
                    <button onclick="viewCity('${city}')" style="margin-top:10px; padding:8px 15px; background:#667eea; color:white; border:none; border-radius:5px; cursor:pointer;">View Prices</button>
                </div>
            `).join('');
        }
        async function viewCity(city) {
            const response = await fetch(`/api/prices?city=${city}`);
            const data = await response.json();
            alert(`Found ${data.count} prices in ${city}`);
        }
        loadCities();
    </script>
</body>
</html>
